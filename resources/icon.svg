<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">
  <title>Graphima</title>
  <!-- Two lanes under one bowed lane: a branch peeling off the main line.
       Lane colours are the ones the graph already draws
       (scmGraph.historyItemRefColor, foreground2, foreground1).
       The drawing is nudged up 2.2 units: lanes hang from the crossbar, so
       geometric centring leaves the mark sitting visibly low in the tile. -->
  <g transform="translate(0,-2.2)">
    <g fill="none" stroke-linecap="round">
      <path d="M8.5 27V12" stroke="#3794FF" stroke-width="2.8"/>
      <path d="M23.5 27V12" stroke="#DC267F" stroke-width="2.8"/>
      <path d="M8.5 12C12 9.3 20 9.3 23.5 12" stroke="#FFB000" stroke-width="2"/>
    </g>
    <circle cx="8.5" cy="12" r="3" fill="#3794FF"/>
    <circle cx="23.5" cy="12" r="3" fill="#DC267F"/>
  </g>
</svg>